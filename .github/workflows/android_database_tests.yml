name: Al-Azzi Android Database Migration Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Emulator tests have their own queue and never cancel the APK build.
concurrency:
  group: al-azzi-database-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-tests:
    name: Database migration tests on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q -o gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      # This workflow runs on a separate GitHub-hosted runner from the APK build.
      # Generate the same local debug key required by app/build.gradle before
      # connectedDebugAndroidTest attempts to install the debug test APK.
      - name: Ensure debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore

      - name: Run database migration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          # Use a clean emulator boot on the stable Ubuntu 24.04 runner to avoid stale snapshot hangs.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          disable-spellchecker: true
          script: timeout 15m ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon --console=plain --max-workers=2
