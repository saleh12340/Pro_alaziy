plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.saleh.enezi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.saleh.enezi.manager.pro'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.3-pro'
    }

    // Let the Android Gradle Plugin generate/use its standard debug keystore.
    // A custom root-level keystore is not guaranteed to exist in CI runners.

    buildTypes {
        debug {
            // Standard debug signing is applied automatically.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
